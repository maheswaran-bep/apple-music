server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /albums {
        proxy_pass http://backend:8000;
    }

    location /albums-with-tracks {
        proxy_pass http://backend:8000;
    }

    location /stream/ {
        proxy_pass http://backend:8000;
    }

    location /artwork/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
